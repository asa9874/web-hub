<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="4" intercept="-1.35"/>
      <feFuncG type="linear" slope="4" intercept="-1.35"/>
      <feFuncB type="linear" slope="4" intercept="-1.35"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" fill="white" filter="url(#grain)"/>
</svg>
