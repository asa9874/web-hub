<svg xmlns="http://www.w3.org/2000/svg" width="340" height="62" viewBox="0 0 340 62">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB6C1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C8A0FF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c">
      <rect x="1.5" y="1.5" width="337" height="59" rx="13"/>
    </clipPath>
  </defs>

  <!-- Ambient backdrop halo -->
  <rect x="3" y="5" width="334" height="52" rx="14" fill="#FF69B4" fill-opacity="0.11"/>

  <!-- Main gradient body -->
  <rect x="1.5" y="1.5" width="337" height="59" rx="13" fill="url(#bg)"/>

  <!-- Top shine (clipped to button shape) -->
  <g clip-path="url(#c)">
    <rect x="1.5" y="1.5" width="337" height="28" fill="url(#sh)"/>
  </g>

  <!-- Gold outer border -->
  <rect x="1.5" y="1.5" width="337" height="59" rx="13" fill="none" stroke="#FFD700" stroke-width="2.5"/>
  <!-- Faint outer glow ring -->
  <rect x="0.5" y="0.5" width="339" height="61" rx="14" fill="none" stroke="#FFD700" stroke-width="0.7" stroke-opacity="0.35"/>
  <!-- Inner white ring -->
  <rect x="4" y="4" width="332" height="54" rx="11" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.22"/>

  <!-- LEFT STAR at (22, 31) — outer R=9, inner r=3.5 -->
  <path d="M22,22 L24.47,28.53 L31,31 L24.47,33.47 L22,40 L19.53,33.47 L13,31 L19.53,28.53 Z" fill="#FFD700"/>
  <path d="M22,25.5 L23.41,29.59 L27.5,31 L23.41,32.41 L22,36.5 L20.59,32.41 L16.5,31 L20.59,29.59 Z" fill="#FFFDE0" fill-opacity="0.55"/>

  <!-- RIGHT STAR at (318, 31) — outer R=9, inner r=3.5 -->
  <path d="M318,22 L320.47,28.53 L327,31 L320.47,33.47 L318,40 L315.53,33.47 L309,31 L315.53,28.53 Z" fill="#FFD700"/>
  <path d="M318,25.5 L319.41,29.59 L323.5,31 L319.41,32.41 L318,36.5 L316.59,32.41 L312.5,31 L316.59,29.59 Z" fill="#FFFDE0" fill-opacity="0.55"/>

  <!-- Flanking accent dots — left -->
  <circle cx="9"   cy="31" r="2.2" fill="#FFD700" fill-opacity="0.62"/>
  <circle cx="36"  cy="31" r="1.3" fill="#FFD700" fill-opacity="0.38"/>
  <!-- Flanking accent dots — right -->
  <circle cx="304" cy="31" r="1.3" fill="#FFD700" fill-opacity="0.38"/>
  <circle cx="331" cy="31" r="2.2" fill="#FFD700" fill-opacity="0.62"/>

  <!-- Thin vertical text-zone dividers -->
  <line x1="41"  y1="19" x2="41"  y2="43" stroke="#FFD700" stroke-width="0.6" stroke-opacity="0.30"/>
  <line x1="299" y1="19" x2="299" y2="43" stroke="#FFD700" stroke-width="0.6" stroke-opacity="0.30"/>
</svg>
